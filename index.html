<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>Flickx Clips | Download soccer clips</title>
  <meta name="description" content="Discover and download clips on Flickx Clips.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#11151e;--panel2:#151b26;--line:#222a38;--muted:#8d98aa;--text:#f4f7fb;--accent:#8b7cff;--accent2:#55d6be}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#25204a 0,transparent 38%),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh}
    button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
    header{height:76px;border-bottom:1px solid #ffffff0c;background:#090b10c9;backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}
    .nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:white;font:700 21px "Space Grotesk"}
    .brandlogo{width:190px;height:auto;display:block}
    .navright{display:flex;align-items:center;gap:10px}.navlink{color:#b7c0cf;text-decoration:none;font-size:13px;padding:10px 13px;border-radius:10px}.navlink:hover{background:#ffffff0b;color:white}
    .hero{padding:76px 0 42px;max-width:760px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#c3bcff;background:#8b7cff18;border:1px solid #8b7cff35;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.04em}
    .dot{width:7px;height:7px;background:var(--accent2);border-radius:50%;box-shadow:0 0 12px var(--accent2)}
    h1{font:700 clamp(42px,7vw,72px)/1.02 "Space Grotesk";letter-spacing:-.055em;margin:22px 0 16px}h1 span{background:linear-gradient(100deg,#b8afff,#7eebd7);background-clip:text;color:transparent}
    .hero p{color:#9da8b9;font-size:16px;line-height:1.7;max-width:560px;margin:0}
    .toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:28px 0 20px;flex-wrap:wrap}
    .searchbox{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:0 14px;width:min(360px,100%);height:46px;color:var(--muted)}
    .searchbox input{background:none;border:0;outline:0;color:white;width:100%;font-size:14px}
    .filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#11151e;color:#9da8b9;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:700}.filter.active,.filter:hover{background:#8b7cff20;border-color:#8b7cff75;color:#d9d4ff}
    .sectionhead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 16px}.sectionhead h2{font:600 20px "Space Grotesk";margin:0}.count{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:70px}
    .card{background:linear-gradient(180deg,#151b26,#10141c);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.22s transform,.22s border-color;cursor:pointer;min-width:0}
    .card:hover{transform:translateY(-4px);border-color:#7568d9}.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#242b3c,#171c29);position:relative;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#090b1099)}
    .play{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ffffffdf;color:#111;box-shadow:0 5px 24px #0008}
    .category{position:absolute;z-index:2;left:12px;top:12px;background:#090b10c9;border:1px solid #ffffff22;border-radius:7px;padding:6px 9px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .cardbody{padding:15px}.cardbody h3{font:600 16px "Space Grotesk";margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:12px;color:var(--muted);line-height:1.5;height:36px;overflow:hidden}.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#8490a2;font-size:11px}.downloadhint{display:flex;align-items:center;gap:6px;color:#c5beff;font-weight:700}
    .state{grid-column:1/-1;border:1px dashed #30394a;border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted)}.state strong{display:block;color:#e6e9f0;font:600 17px "Space Grotesk";margin:12px 0 6px}
    footer{border-top:1px solid #ffffff0c;padding:25px 0;color:#687386;font-size:12px}.foot{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
    .modal{position:fixed;inset:0;background:#03050bdc;backdrop-filter:blur(12px);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{width:min(850px,100%);max-height:94vh;overflow:auto;background:#111722;border:1px solid #30394a;border-radius:20px;box-shadow:0 25px 100px #000b}.modalbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.modalbar strong{font:600 15px "Space Grotesk"}.iconbtn{width:34px;height:34px;border:1px solid var(--line);background:#ffffff08;color:white;border-radius:10px;display:grid;place-items:center}.player{width:100%;max-height:55vh;background:#05070b;display:block}.modalcontent{padding:20px}.modalcontent h2{font:700 24px "Space Grotesk";margin:0 0 8px}.modalcontent p{color:#9da8b9;line-height:1.6;font-size:14px;margin:0 0 18px}.primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;border:0;border-radius:11px;padding:12px 17px;background:linear-gradient(110deg,#8d7cff,#6c5ce7);color:white;font-weight:800;font-size:13px;box-shadow:0 8px 25px #7565ff30}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:58px}}
    @media(max-width:560px){.wrap{width:min(100% - 26px,1180px)}header{height:66px}.brand{font-size:18px}.navlink{padding:8px}.hero{padding:48px 0 25px}h1{font-size:47px}.hero p{font-size:14px}.toolbar{align-items:stretch}.searchbox{width:100%}.grid{grid-template-columns:1fr;gap:13px}.card{display:grid;grid-template-columns:42% 1fr}.thumb{height:100%;min-height:145px;aspect-ratio:auto}.cardbody{padding:12px}.cardbody h3{white-space:normal;font-size:14px}.desc{height:52px}.cardfoot{margin-top:9px}.filters{width:100%}.filter{flex:1}.foot{display:block}.foot span{display:block;margin:5px 0}}
  </style>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="#"><img class="brandlogo" src="./logo.svg" alt="Flickx Clips logo"></a>
  <div class="navright"><a class="navlink" href="#clips">Explore clips</a></div>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow"><span class="dot"></span> THE CLIP LIBRARY</div>
    <h1>Find your next<br><span>favorite clip.</span></h1>
    <p>Watch previews, discover new edits and download clips from the Flickx library.</p>
  </section>
  <section id="clips">
    <div class="toolbar">
      <label class="searchbox"><i data-lucide="search" width="17"></i><input id="search" type="search" placeholder="Search clips..."></label>
      <div class="filters" id="filters"><button class="filter active" data-category="All">All clips</button></div>
    </div>
    <div class="sectionhead"><h2>Latest clips</h2><span class="count" id="count">Loading clips...</span></div>
    <div class="grid" id="clipGrid"><div class="state"><i data-lucide="loader-circle"></i><strong>Loading the library</strong>Just a second</div></div>
  </section>
</main>
<footer><div class="wrap foot"><span>© <span id="year"></span> Flickx Clips</span><span>Clips are provided by their respective uploaders</span></div></footer>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Clip preview">
  <div class="dialog">
    <div class="modalbar"><strong>CLIP PREVIEW</strong><button class="iconbtn" id="closeModal" aria-label="Close"><i data-lucide="x"></i></button></div>
    <video class="player" id="modalVideo" controls playsinline preload="metadata"></video>
    <div class="modalcontent"><h2 id="modalTitle"></h2><p id="modalDesc"></p><a class="primary" id="downloadBtn" href="#" download><i data-lucide="download" width="17"></i> Download clip</a></div>
  </div>
</div>
<script>
const SUPABASE_URL = "https://sfjqxtdbtcgxleerwibo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_bLlSutMI5kpVSIKFfjm8zQ_yhU1p9xH";
const BUCKET = "flickx-videos";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const grid = document.getElementById("clipGrid");
const search = document.getElementById("search");
const filters = document.getElementById("filters");
let clips = [], activeCategory = "All";

function esc(value=""){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function publicUrl(path){return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;}
function dateLabel(value){return new Date(value).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}
function renderFilters(){
  const categories=["All",...new Set(clips.map(v=>v.category).filter(Boolean))];
  filters.innerHTML=categories.map(c=>`<button class="filter ${c===activeCategory?"active":""}" data-category="${esc(c)}">${c==="All"?"All clips":esc(c)}</button>`).join("");
  filters.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{activeCategory=b.dataset.category;renderFilters();renderClips();}));
}
function renderClips(){
  const term=search.value.trim().toLowerCase();
  const shown=clips.filter(v=>(activeCategory==="All"||v.category===activeCategory)&&(`${v.title} ${v.description||""} ${v.category||""}`).toLowerCase().includes(term));
  document.getElementById("count").textContent=`${shown.length} ${shown.length===1?"clip":"clips"}`;
  if(!shown.length){grid.innerHTML=`<div class="state"><i data-lucide="video-off"></i><strong>No clips found</strong>Try another search or check back later</div>`;lucide.createIcons();return;}
  grid.innerHTML=shown.map(v=>{
    const thumb=v.thumbnail_path?publicUrl(v.thumbnail_path):"";
    return `<article class="card" data-id="${v.id}">
      <div class="thumb">${thumb?`<img src="${esc(thumb)}" alt="" loading="lazy">`:""}<span class="category">${esc(v.category||"Clip")}</span><span class="play"><i data-lucide="play" fill="currentColor" width="19"></i></span></div>
      <div class="cardbody"><h3>${esc(v.title)}</h3><div class="desc">${esc(v.description||"Watch the preview and download this clip.")}</div><div class="cardfoot"><span>${dateLabel(v.created_at)}</span><span class="downloadhint"><i data-lucide="download" width="13"></i> Download</span></div></div>
    </article>`;
  }).join("");
  grid.querySelectorAll(".card").forEach(card=>card.addEventListener("click",()=>openClip(clips.find(v=>v.id===card.dataset.id))));
  lucide.createIcons();
}
function openClip(v){
  if(!v)return;
  const url=publicUrl(v.video_path);
  document.getElementById("modalTitle").textContent=v.title;
  document.getElementById("modalDesc").textContent=v.description||"";
  const video=document.getElementById("modalVideo");video.src=url;video.load();
  const download=document.getElementById("downloadBtn");
  download.href=url+(url.includes("?")?"&":"?")+"download="+encodeURIComponent((v.title||"flickx-clip").replace(/[^\w -]/g,"")+".mp4");
  document.getElementById("modal").classList.add("open");
}
function closeModal(){const m=document.getElementById("modal");m.classList.remove("open");const v=document.getElementById("modalVideo");v.pause();v.removeAttribute("src");v.load();}
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
search.addEventListener("input",renderClips);
async function loadClips(){
  const {data,error}=await db.from("videos").select("id,title,description,category,video_path,thumbnail_path,created_at").eq("is_published",true).order("created_at",{ascending:false});
  if(error){grid.innerHTML=`<div class="state"><strong>Couldn't load clips</strong>Check that you ran setup.sql in Supabase then refresh</div>`;document.getElementById("count").textContent="Library unavailable";console.error(error);return;}
  clips=data||[];renderFilters();renderClips();
}
document.getElementById("year").textContent=new Date().getFullYear();
lucide.createIcons();loadClips();
</script>
</body>
</html>
